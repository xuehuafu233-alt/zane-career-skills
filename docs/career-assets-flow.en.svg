<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">From real experience to application-ready career assets</title>
  <desc id="desc">Goals and source material move through evidence, positioning, asset roles, creation, and release QA.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:0}.title{font-size:23px;font-weight:700;fill:#f8fafc}.sub{font-size:12px;fill:#94a3b8}.num{font-size:10px;font-weight:700}.name{font-size:12.5px;font-weight:700;fill:#f8fafc}.detail{font-size:9.5px;fill:#cbd5e1}</style>
  </defs>
  <rect width="1200" height="430" fill="#0f172a"/><rect width="1200" height="430" fill="url(#grid)"/>
  <text x="54" y="54" class="title">From real experience to a recruiter who wants to know more</text>
  <text x="54" y="80" class="sub">Not a template: align the goal, evidence, expression, and release state</text>
  <path d="M248 225H278" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M468 225H498" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M688 225H718" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M908 225H938" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g><rect x="58" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="58" y="155" width="190" height="140" rx="8" fill="rgba(8,51,68,.5)" stroke="#22d3ee" stroke-width="1.5"/><text x="78" y="181" class="num" fill="#22d3ee">01 INPUT</text><text x="153" y="216" class="name" text-anchor="middle">Goal &amp; source material</text><text x="153" y="246" class="detail" text-anchor="middle">Role · experience · work · taste</text><text x="153" y="268" class="detail" text-anchor="middle">Public boundary · deliverable</text></g>
  <g><rect x="278" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="278" y="155" width="190" height="140" rx="8" fill="rgba(6,78,59,.5)" stroke="#34d399" stroke-width="1.5"/><text x="298" y="181" class="num" fill="#34d399">02 EVIDENCE</text><text x="373" y="216" class="name" text-anchor="middle">Facts &amp; evidence</text><text x="373" y="246" class="detail" text-anchor="middle">Action · result · date · source</text><text x="373" y="268" class="detail" text-anchor="middle">Individual vs team attribution</text></g>
  <g><rect x="498" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="498" y="155" width="190" height="140" rx="8" fill="rgba(76,29,149,.5)" stroke="#a78bfa" stroke-width="1.5"/><text x="518" y="181" class="num" fill="#a78bfa">03 POSITION</text><text x="593" y="216" class="name" text-anchor="middle">Position &amp; asset roles</text><text x="593" y="246" class="detail" text-anchor="middle">Who needs to see what first</text><text x="593" y="268" class="detail" text-anchor="middle">Resume · site · deep cases</text></g>
  <g><rect x="718" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="718" y="155" width="190" height="140" rx="8" fill="rgba(120,53,15,.45)" stroke="#fbbf24" stroke-width="1.5"/><text x="738" y="181" class="num" fill="#fbbf24">04 CREATE</text><text x="813" y="216" class="name" text-anchor="middle">Content &amp; visual system</text><text x="813" y="246" class="detail" text-anchor="middle">Voice · structure · localization</text><text x="813" y="268" class="detail" text-anchor="middle">Visual personality · responsive UI</text></g>
  <g><rect x="938" y="155" width="204" height="140" rx="8" fill="#0f172a"/><rect x="938" y="155" width="204" height="140" rx="8" fill="rgba(59,130,246,.45)" stroke="#60a5fa" stroke-width="1.5"/><text x="958" y="181" class="num" fill="#60a5fa">05 RELEASE</text><text x="1040" y="216" class="name" text-anchor="middle">Cross-format QA</text><text x="1040" y="246" class="detail" text-anchor="middle">Web · PDF · Word · links</text><text x="1040" y="268" class="detail" text-anchor="middle">Approve before apply or deploy</text></g>
  <rect x="210" y="346" width="780" height="42" rx="21" fill="rgba(30,41,59,.75)" stroke="#475569"/><text x="600" y="372" class="detail" text-anchor="middle">Same method, different experience, role, voice, and taste: the output should change</text>
</svg>
