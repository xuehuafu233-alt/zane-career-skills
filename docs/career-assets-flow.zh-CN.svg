<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">从真实经历到可投递职业资产</title>
  <desc id="desc">目标与材料经过事实证据、招聘定位、载体分工、内容设计和发布验收，形成可投递职业资产。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif;letter-spacing:0}
      .title{font-size:24px;font-weight:700;fill:#f8fafc}.sub{font-size:12px;fill:#94a3b8}
      .num{font-size:11px;font-weight:700}.name{font-size:16px;font-weight:700;fill:#f8fafc}.detail{font-size:11px;fill:#cbd5e1}
      .arrow-label{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#0f172a"/><rect width="1200" height="430" fill="url(#grid)"/>
  <text x="54" y="54" class="title">从真实经历，到招聘者愿意继续了解你</text>
  <text x="54" y="80" class="sub">不是套模板，而是让目标、证据、表达与发布状态彼此对齐</text>

  <path d="M248 225H278" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M468 225H498" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M688 225H718" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M908 225H938" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g><rect x="58" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="58" y="155" width="190" height="140" rx="8" fill="rgba(8,51,68,.5)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="78" y="181" class="num" fill="#22d3ee">01 INPUT</text><text x="153" y="216" class="name" text-anchor="middle">目标与真实材料</text>
    <text x="153" y="246" class="detail" text-anchor="middle">岗位 · 经历 · 项目 · 审美</text><text x="153" y="268" class="detail" text-anchor="middle">公开边界 · 交付形式</text></g>
  <g><rect x="278" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="278" y="155" width="190" height="140" rx="8" fill="rgba(6,78,59,.5)" stroke="#34d399" stroke-width="1.5"/>
    <text x="298" y="181" class="num" fill="#34d399">02 EVIDENCE</text><text x="373" y="216" class="name" text-anchor="middle">事实与证据</text>
    <text x="373" y="246" class="detail" text-anchor="middle">动作 · 结果 · 时间 · 来源</text><text x="373" y="268" class="detail" text-anchor="middle">个人归因与团队边界</text></g>
  <g><rect x="498" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="498" y="155" width="190" height="140" rx="8" fill="rgba(76,29,149,.5)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="518" y="181" class="num" fill="#a78bfa">03 POSITION</text><text x="593" y="216" class="name" text-anchor="middle">招聘定位与分工</text>
    <text x="593" y="246" class="detail" text-anchor="middle">先让谁看懂什么</text><text x="593" y="268" class="detail" text-anchor="middle">简历 · 网站 · 深读案例</text></g>
  <g><rect x="718" y="155" width="190" height="140" rx="8" fill="#0f172a"/><rect x="718" y="155" width="190" height="140" rx="8" fill="rgba(120,53,15,.45)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="738" y="181" class="num" fill="#fbbf24">04 CREATE</text><text x="813" y="216" class="name" text-anchor="middle">内容与视觉生产</text>
    <text x="813" y="246" class="detail" text-anchor="middle">文风 · 结构 · 本地化</text><text x="813" y="268" class="detail" text-anchor="middle">视觉人格 · 响应式实现</text></g>
  <g><rect x="938" y="155" width="204" height="140" rx="8" fill="#0f172a"/><rect x="938" y="155" width="204" height="140" rx="8" fill="rgba(59,130,246,.45)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="958" y="181" class="num" fill="#60a5fa">05 RELEASE</text><text x="1040" y="216" class="name" text-anchor="middle">跨格式验收</text>
    <text x="1040" y="246" class="detail" text-anchor="middle">网页 · PDF · Word · 链接</text><text x="1040" y="268" class="detail" text-anchor="middle">确认后再投递或部署</text></g>

  <rect x="250" y="346" width="700" height="42" rx="21" fill="rgba(30,41,59,.75)" stroke="#475569"/>
  <text x="600" y="372" class="detail" text-anchor="middle">同一套方法，不同经历、岗位、文风与审美，应当得到不同结果</text>
</svg>
